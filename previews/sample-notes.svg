<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040">
  <rect width="800" height="1040" fill="#F4F4F5"/>
  <rect x="40" y="36" width="720" height="968" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
  <text x="72" y="92" font-family="Georgia, serif" font-size="28" fill="#18181B">1. Key ideas</text>
  <text x="72" y="128" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717A">How a notes page can look inside the PDF</text>
  <rect x="72" y="156" width="656" height="72" rx="8" fill="#EFF6FF"/>
  <text x="92" y="186" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1E3A8A">Definition</text>
  <text x="92" y="210" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1E3A8A">A short highlighted box for the idea students must remember.</text>
  <text x="72" y="276" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F3F46">" First point, written in plain language.</text>
  <text x="72" y="312" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F3F46">" Second point, with one example in the next line.</text>
  <text x="92" y="348" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52525B">Example: a one-line case so the page is easy to scan.</text>
  <text x="72" y="392" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F3F46">" Third point, kept short for revision.</text>
  <line x1="72" y1="430" x2="720" y2="430" stroke="#E4E4E7"/>
  <text x="72" y="470" font-family="Georgia, serif" font-size="22" fill="#18181B">Remember</text>
  <text x="72" y="510" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F3F46">A closing line that repeats the rule in one sentence.</text>
  <text x="72" y="960" font-family="Inter, Arial, sans-serif" font-size="13" fill="#A1A1AA">Sample content preview · Page 2</text>
</svg>
