<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
  <title>{% block title %}AIkors{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

{% block navbar %}
<nav class="navbar" aria-label="Main">
  <a href="/" class="nav-logo" aria-label="AIkors home">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
    AIkors
  </a>
  {% block nav_links %}{% endblock %}
  <div class="nav-actions" id="nav-actions"></div>
</nav>
{% endblock %}

<div id="toast-container" role="region" aria-label="Notifications"></div>

<main id="main">
{% block content %}{% endblock %}
</main>

{% block footer %}
<footer class="site-footer">
  <div class="container site-footer-inner">
    <a href="/" class="nav-logo" aria-label="AIkors home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
      AIkors
    </a>
    <p>&copy; <span id="footer-year"></span> AIkors. All rights reserved.</p>
  </div>
</footer>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
{% endblock %}

<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
