{% extends "admin_base.html" %}
{% block title %}Manage Users — AIkors Admin{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title">Users</h2>
  <input type="text" id="search-input" class="search-input" placeholder="Search Name or Email..." oninput="handleSearch()">
</div>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr><th>ID</th><th>User Details</th><th>Role (Change)</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
    </tbody>
  </table>
</div>
<div id="pagination-container" class="pagination"></div>
<div id="infinite-loader" class="infinite-loader"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Loading...</div>
{% endblock %}

{% block scripts %}
<script>
  let state = { page: 1, limit: 15, search: '', total: 0 };
  let searchTimeout = null;

  async function loadData() {
    const skip = (state.page - 1) * state.limit;
    let url = `/admin/users?skip=${skip}&limit=${state.limit}`;
    if (state.search) url += `&search=${encodeURIComponent(state.search)}`;

    try {
      const res = await API.get(url);
      const items = res.items || [];
      state.total = res.total || 0;
      
      const html = items.map(u => `
        <tr>
          <td style="font-weight:600;">#${u.id}</td>
          <td>
            <div style="font-weight:600;">${u.name || '-'}</div>
            <div style="font-size:0.8rem; color:var(--text-secondary);">${u.email || '-'}</div>
          </td>
          <td>
            <!-- 🚀 NEW: Role Change Dropdown -->
            <select style="padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-surface); font-size: 0.85rem; font-weight:600; cursor:pointer;" onchange="changeUserRole(${u.id}, this.value)">
              <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td><span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}">${u.is_active ? 'Active' : 'Blocked'}</span></td>
          <td>
            <button class="btn-ghost" style="padding:4px 12px; height:auto;" onclick="window.location.href='/admin/users/${u.id}'">Manage</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('table-body').innerHTML = html || `<tr><td colspan="5" style="text-align:center; padding:24px;">No users found</td></tr>`;
      updatePaginationUI();
    } catch(err) { Toast.error("Failed to load users"); }
  }

  function handleSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      state.search = document.getElementById('search-input').value;
      state.page = 1;
      loadData();
    }, 400);
  }

  function updatePaginationUI() {
    const container = document.getElementById('pagination-container');
    const totalPages = Math.ceil(state.total / state.limit) || 1;
    const start = state.total === 0 ? 0 : ((state.page - 1) * state.limit) + 1;
    const end = Math.min(state.page * state.limit, state.total);

    container.innerHTML = `
      <div class="pagination-info">Showing <span>${start}</span> to <span>${end}</span> of <span>${state.total}</span></div>
      <div class="page-btns">
        <button class="page-btn" onclick="changePage(-1)" ${state.page === 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> Previous</button>
        <button class="page-btn" onclick="changePage(1)" ${state.page === totalPages ? 'disabled' : ''}>Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      </div>
    `;
  }

  function changePage(delta) { state.page += delta; loadData(); }

  // 🚀 NEW: Role Update API Call
  async function changeUserRole(id, newRole) {
    try {
      await API.patch(`/admin/users/${id}/role`, { role: newRole });
      Toast.success(`Role successfully changed to ${newRole}`);
    } catch(err) { 
      Toast.error(err.message); 
      setTimeout(() => loadData(), 1500); // Reload data to reset dropdown on failure
    }
  }

  setTimeout(loadData, 100);
</script>
{% endblock %}
