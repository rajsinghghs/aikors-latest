{% extends "admin_base.html" %}
{% block title %}Manage Products — AIkors Admin{% endblock %}

{% block extra_head %}
<style>
  .modal-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; background: var(--bg-surface); border-radius: var(--radius-xl); padding: 32px; position: relative; box-shadow: var(--shadow-modal);}
  .modal-close { position:absolute; top:20px; right:20px; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-secondary);}

  /* Premium Skeleton Loader (Prefetch Animation) */
  .skeleton-row td { padding: 16px; border-bottom: 1px solid var(--border); }
  .skel-bar { 
    height: 16px; background: var(--bg-surface-hover); 
    border-radius: 4px; animation: faang-shimmer 2s infinite linear; 
    background-image: linear-gradient(90deg, var(--bg-surface-hover) 0px, var(--border) 50%, var(--bg-surface-hover) 100%); 
    background-size: 200% 100%; 
  }
  @keyframes faang-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title">Products</h2>
  <div style="display:flex; gap:12px;">
    <input type="text" id="search-input" class="search-input" placeholder="Search Title or Category..." oninput="handleSearch()">
    <button onclick="openProductForm(null)" class="btn-primary">Add Product</button>
  </div>
</div>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr><th>Product</th><th>Pricing</th><th>Sales Count</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="table-body">
      <!-- Skeletons will be injected here dynamically by JS -->
    </tbody>
  </table>
</div>
<div id="pagination-container" class="pagination"></div>

<!-- Add/Edit Product Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeProductForm()">✕</button>
    <h3 id="modal-title" style="font-size:1.5rem; margin-bottom:24px;">Add Product</h3>
    <form id="product-form" onsubmit="saveProduct(event)">
      <input type="hidden" id="edit-id">
      
      <div class="form-group">
        <label class="form-label">Title *</label>
        <input id="p-title" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Short Description</label>
        <input id="p-short-desc" class="form-input" placeholder="A brief one-line summary">
      </div>

      <div class="form-group">
        <label class="form-label">Full Description</label>
        <textarea id="p-desc" class="form-input" rows="4" placeholder="Detailed product description..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Tags</label>
        <input id="p-tags" class="form-input" placeholder="e.g. course, python, notes (comma separated)">
      </div>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group"><label class="form-label">Price (₹) *</label><input id="p-price" class="form-input" type="number" required></div>
        <div class="form-group"><label class="form-label">Original Price (₹)</label><input id="p-original" class="form-input" type="number"></div>
      </div>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group"><label class="form-label">Category</label><input id="p-category" class="form-input" placeholder="Notes, PDFs, etc."></div>
        <div class="form-group"><label class="form-label">Sales Count (Adjustable)</label><input id="p-sales" class="form-input" type="number" placeholder="0"></div>
      </div>
      
      <div class="form-group" style="display:flex; gap:16px; align-items:center; margin-bottom: 24px;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="p-active"> Is Active (Visible)</label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="p-featured"> Featured</label>
      </div>
      
      <!-- Upload Section with Previews -->
      <div id="upload-section" style="display:none; background:var(--bg-surface-hover); padding:20px; border-radius:var(--radius-md); margin-bottom:24px; border: 1px dashed var(--border-strong);">
        
        <!-- Thumbnail Upload & Preview -->
        <div style="margin-bottom:24px;">
          <label class="form-label" style="font-weight:600;">Upload Thumbnail (Image)</label>
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <input type="file" id="thumb-file" accept="image/*" class="form-input" style="padding:8px;" onchange="handleMediaPreview(this, 'thumb')">
            <button type="button" onclick="uploadMedia('thumbnail')" class="btn-ghost" style="border: 1px solid var(--accent); color: var(--accent);">Upload</button>
          </div>
          <div id="thumb-preview-box" style="display:none; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-base); max-width: max-content;"></div>
        </div>

        <div style="height:1px; background:var(--border-strong); margin:20px 0;"></div>

        <!-- File Upload & Preview -->
        <div>
          <label class="form-label" style="font-weight:600;">Upload Product File (PDF/ZIP)</label>
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <input type="file" id="product-file" accept=".pdf,.zip,.rar" class="form-input" style="padding:8px;" onchange="handleMediaPreview(this, 'file')">
            <button type="button" onclick="uploadMedia('file')" class="btn-ghost" style="border: 1px solid var(--accent); color: var(--accent);">Upload</button>
          </div>
          <div id="file-preview-box" style="display:none; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-base); max-width: 100%;"></div>
        </div>

      </div>
      
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button type="button" onclick="closeProductForm()" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary" id="save-product-btn">Save Product</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let state = { page: 1, limit: 15, search: '', total: 0 };
  let searchTimeout = null;
  let allLoadedProducts = []; 

  async function loadData() {
    // Inject Skeleton Loader while fetching data
    const skelHtml = Array(5).fill(`
      <tr class="skeleton-row">
        <td><div class="skel-bar" style="width:70%; margin-bottom:6px;"></div><div class="skel-bar" style="width:40%; height:12px;"></div></td>
        <td><div class="skel-bar" style="width:50%; margin-bottom:6px;"></div><div class="skel-bar" style="width:30%; height:12px;"></div></td>
        <td><div class="skel-bar" style="width:60%;"></div></td>
        <td><div class="skel-bar" style="width:40px; height:24px; border-radius:12px;"></div></td>
        <td><div class="skel-bar" style="width:60px; height:32px; border-radius:6px;"></div></td>
      </tr>
    `).join('');
    document.getElementById('table-body').innerHTML = skelHtml;

    const skip = (state.page - 1) * state.limit;
    let url = `/admin/products?skip=${skip}&limit=${state.limit}`;
    if (state.search) url += `&search=${encodeURIComponent(state.search)}`;

    try {
      const res = await API.get(url);
      const items = res.items || [];
      state.total = res.total || 0;
      
      allLoadedProducts = items;

      const html = items.map(p => `
        <tr>
          <td>
            <div style="font-weight:600;">${p.title}</div>
            <div style="font-size:0.8rem; color:var(--accent);">${p.category || '-'}</div>
          </td>
          <td>
            <div style="font-weight:700;">${formatPrice(p.price)}</div>
            ${p.original_price ? `<div style="font-size:0.8rem; text-decoration:line-through; color:var(--text-muted);">${formatPrice(p.original_price)}</div>` : ''}
          </td>
          <td><span style="font-weight:600;">${p.total_sales || 0}</span> enrolled</td>
          <td><span class="badge ${p.is_active ? 'badge-success' : 'badge-danger'}">${p.is_active ? 'Active':'Hidden'}</span></td>
          <td>
            <button class="btn-ghost" style="padding:6px 14px; height:auto;" onclick="openProductForm(${p.id})">Edit</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('table-body').innerHTML = html || `<tr><td colspan="5" style="text-align:center; padding:24px;">No products found</td></tr>`;
      updatePaginationUI();
    } catch(err) { Toast.error("Failed to load products"); }
  }

  function handleSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      state.search = document.getElementById('search-input').value;
      state.page = 1;
      loadData();
    }, 400);
  }

  function updatePaginationUI() {
    const container = document.getElementById('pagination-container');
    const totalPages = Math.ceil(state.total / state.limit) || 1;
    const start = state.total === 0 ? 0 : ((state.page - 1) * state.limit) + 1;
    const end = Math.min(state.page * state.limit, state.total);

    container.innerHTML = `
      <div class="pagination-info">Showing <span>${start}</span> to <span>${end}</span> of <span>${state.total}</span></div>
      <div class="page-btns">
        <button class="page-btn" onclick="changePage(-1)" ${state.page === 1 ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> Previous
        </button>
        <button class="page-btn" onclick="changePage(1)" ${state.page === totalPages ? 'disabled' : ''}>
          Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    `;
  }

  // Handle Live File Previews Before Upload 
  function handleMediaPreview(input, type) {
    const file = input.files[0];
    const box = document.getElementById(`${type}-preview-box`);
    
    if(!file) return; 
    
    box.style.display = 'block';
    const objectUrl = URL.createObjectURL(file);
    
    if(type === 'thumb') {
      box.innerHTML = `
        <div style="font-size:0.8rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px;">Live Preview:</div>
        <img src="${objectUrl}" style="max-width:200px; max-height:140px; border-radius:8px; object-fit:cover; display:block; border:1px solid var(--border);">
        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:8px; word-break:break-all; font-family:monospace;">Local File: ${file.name}</div>
      `;
    } else {
      box.innerHTML = `
        <div style="font-size:0.8rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px;">Live Preview:</div>
        <a href="${objectUrl}" target="_blank" style="display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-weight:600; text-decoration:none; padding:8px 12px; background:var(--bg-surface-hover); border-radius:6px; border:1px solid var(--border);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Open & Confirm PDF/File
        </a>
        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:8px; word-break:break-all; font-family:monospace;">Local File: ${file.name}</div>
      `;
    }
  }

  function openProductForm(id) {
    document.getElementById('product-form').reset();
    document.getElementById('edit-id').value = '';
    
    document.getElementById('upload-section').style.display = 'none';
    document.getElementById('thumb-preview-box').style.display = 'none';
    document.getElementById('file-preview-box').style.display = 'none';
    document.getElementById('thumb-preview-box').innerHTML = '';
    document.getElementById('file-preview-box').innerHTML = '';
    
    document.getElementById('modal-title').textContent = 'Add Product';
    
    document.getElementById('p-short-desc').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-tags').value = '';
    
    if (id) {
      const p = allLoadedProducts.find(x => x.id === id);
      if(p) {
        document.getElementById('modal-title').textContent = 'Edit Product';
        document.getElementById('edit-id').value = p.id;
        document.getElementById('p-title').value = p.title;
        document.getElementById('p-short-desc').value = p.short_description || '';
        document.getElementById('p-desc').value = p.description || '';
        document.getElementById('p-tags').value = p.tags || '';
        document.getElementById('p-price').value = p.price;
        document.getElementById('p-original').value = p.original_price || '';
        document.getElementById('p-category').value = p.category || '';
        document.getElementById('p-sales').value = p.total_sales || 0;
        document.getElementById('p-active').checked = p.is_active;
        document.getElementById('p-featured').checked = p.is_featured;
        document.getElementById('upload-section').style.display = 'block';

        // 🚀 NAYA: Existing Image is now Clickable (Opens in new tab)
        if(p.thumbnail_url) {
          const tBox = document.getElementById('thumb-preview-box');
          tBox.style.display = 'block';
          tBox.innerHTML = `
            <div style="font-size:0.8rem; font-weight:600; color:var(--success); margin-bottom:8px;">Currently Uploaded:</div>
            <a href="${p.thumbnail_url}" target="_blank" title="Click to view full image" style="display:inline-block; border: 2px solid transparent; transition:0.2s; border-radius:8px;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='transparent'">
              <img src="${p.thumbnail_url}" style="max-width:200px; max-height:140px; border-radius:6px; object-fit:cover; display:block; border:1px solid var(--border);">
            </a>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:8px;">Click image to open in full size</div>
          `;
        }
        
        // 🚀 NAYA: View / Open File Button Added for existing PDFs
        if(p.file_name) {
          const fBox = document.getElementById('file-preview-box');
          fBox.style.display = 'block';
          fBox.innerHTML = `
            <div style="font-size:0.8rem; font-weight:600; color:var(--success); margin-bottom:8px;">Currently Uploaded:</div>
            
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
              <div style="display:inline-flex; align-items:center; gap:8px; color:var(--text-primary); font-weight:500; padding:8px 12px; background:var(--bg-surface-hover); border-radius:6px; border:1px solid var(--border);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
                ${p.file_name}
              </div>
              
              <button type="button" class="btn-primary" onclick="adminPreviewFile(${p.id})" style="height: 38px; padding: 0 16px; font-size: 0.85rem; border-radius: 6px; display:inline-flex; align-items:center; gap:6px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                  Open File in New Tab
              </button>
            </div>

            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:8px;">Select a new file above to replace this.</div>
          `;
        }
      }
    }
    document.getElementById('product-modal').classList.add('open');
  }

  function closeProductForm() { document.getElementById('product-modal').classList.remove('open'); }

  async function saveProduct(e) {
    e.preventDefault();
    const btn = document.getElementById('save-product-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Saving...'; btn.disabled = true;
    
    const id = document.getElementById('edit-id').value;
    
    const payload = {
      title: document.getElementById('p-title').value,
      short_description: document.getElementById('p-short-desc').value,
      description: document.getElementById('p-desc').value,
      tags: document.getElementById('p-tags').value,
      price: parseFloat(document.getElementById('p-price').value),
      original_price: parseFloat(document.getElementById('p-original').value) || null,
      category: document.getElementById('p-category').value,
      total_sales: parseInt(document.getElementById('p-sales').value) || 0,
      is_active: document.getElementById('p-active').checked,
      is_featured: document.getElementById('p-featured').checked
    };

    try {
      if(id) {
        await API.put(`/products/${id}`, payload);
        Toast.success('Product updated');
        closeProductForm();
      } else {
        const res = await API.post('/products', payload);
        document.getElementById('edit-id').value = res.id;
        document.getElementById('upload-section').style.display = 'block';
        Toast.success('Product created. Now upload files!');
        btn.innerHTML = originalText; btn.disabled = false;
        return; 
      }
      loadData();
    } catch(err) { Toast.error(err.message); }
    finally { btn.innerHTML = originalText; btn.disabled = false; }
  }

  async function uploadMedia(type) {
    const id = document.getElementById('edit-id').value;
    const fileInput = document.getElementById(type === 'thumbnail' ? 'thumb-file' : 'product-file');
    if(!fileInput.files[0]) { Toast.error('Please select a file first'); return; }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    try {
      await API.upload(`/products/${id}/upload-${type}`, formData);
      Toast.success(`${type} uploaded successfully!`);
      // Reload to show new preview
      setTimeout(() => openProductForm(id), 500);
    } catch(err) { Toast.error(err.message); }
  }

  // 🚀 NAYA: Secure Admin File Viewer 
  function adminPreviewFile(productId) {
    const token = Auth.getToken();
    fetch('/api/orders/download/' + productId, { 
        headers: { 'Authorization': 'Bearer ' + token } 
    })
    .then(res => {
        if (res.redirected) {
            // Cloudflare R2 URL automatically opens in new tab
            window.open(res.url, '_blank');
            return;
        }
        if (!res.ok) throw new Error('You do not have permission. Check backend code.');
        return res.blob();
    })
    .then(blob => {
        if(blob) {
            // Local file opens in new tab
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }
    })
    .catch(err => Toast.error(err.message));
  }

  setTimeout(loadData, 100);
</script>
{% endblock %}
